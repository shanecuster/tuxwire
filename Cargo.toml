# Root Cargo.toml: this file no longer describes a package. It describes a
# *workspace* -- a set of related crates (Rust's word for a package/library)
# that are built together, share ONE Cargo.lock (so every crate resolves to the
# same dependency versions) and ONE `target/` build directory (so a dependency
# compiled for one crate is reused by the others instead of rebuilt).
#
# Why a workspace at all? The Android app (a separate repository) has to reuse
# tuxwire's logic -- fetching, storage, themes, icons -- but it cannot import
# code from inside a finished terminal program. Splitting the project into a
# reusable library crate (`core/`) and the terminal program (`tui/`) lets both
# apps share one copy of that logic, so a bug fixed once is fixed everywhere.
#
# `core/` is the shared library (no terminal code); `tui/` is the terminal
# program that uses it.
[workspace]
# `members` lists the crates (directories containing a Cargo.toml) in the
# workspace. Paths are relative to this file.
members = ["core", "tui"]

# The "resolver" decides how Cargo picks dependency versions and features.
# Version "3" is the one that goes with Rust edition 2024 (which the crate
# already uses), and it prefers dependency versions compatible with the
# crate's declared minimum Rust version. A workspace root has no edition of its
# own to infer this from, so it has to be stated explicitly.
resolver = "3"

# --- Shared dependency versions ---------------------------------------------
# `[workspace.dependencies]` is the ONE place each external crate's version and
# features are declared. Member crates (core/, tui/) then say
# `some-crate.workspace = true` instead of repeating the version, so the two
# can never drift apart. The comments below are the ones that used to sit in
# the single crate's manifest, kept because they explain why each crate is here.
[workspace.dependencies]
# --- Error handling --------------------------------------------------
# `anyhow` gives us a single catch-all error type (`anyhow::Error`, often
# used via the `anyhow::Result<T>` alias) for application-level code. Rust
# has no exceptions — functions that can fail return `Result<T, E>`, and
# you're forced to acknowledge that explicitly (see the comments in
# fetchers/rss.rs for what that looks like day to day). Writing a bespoke
# error `enum` for every module is the more "idiomatic library" approach,
# but for an application (as opposed to a crate other people import) it's
# usually overkill — anyhow lets any error type be converted into one
# common `anyhow::Error` via `?`, with a message you can attach via
# `.context(...)`.
anyhow = "1.0.104"

# --- Timestamps --------------------------------------------------------
# `chrono` provides `DateTime<Utc>` and friends, matching the `timestamp:
# DateTime<Utc>` field on the `Article` struct in ARCHITECTURE.md. The
# "serde" feature teaches chrono's types how to serialize/deserialize
# themselves via serde (see below) — we need that for both SQLite storage
# and any future JSON/TOML round-tripping.
chrono = { version = "0.4.45", features = ["serde"] }

# --- Terminal control ---------------------------------------------------
# `crossterm` is the low-level library that puts the terminal into "raw
# mode" (reading keys immediately instead of line-by-line), draws to
# arbitrary screen positions, and reads keyboard/mouse events. `ratatui`
# (below) is built on top of it — ratatui handles *layout and widgets*,
# crossterm handles *talking to the actual terminal*.
crossterm = "0.29.0"

# --- Feed parsing --------------------------------------------------------
# `feed-rs` parses RSS *and* Atom feeds into one unified `Feed`/`Entry`
# model, so our fetcher code doesn't need to care which format a given
# source publishes — per ARCHITECTURE.md, source type is "RSS/Atom" as a
# single category. The alternative (the plain `rss` crate) only handles
# RSS and would force us to special-case Atom sources later.
feed-rs = "2.4.0"

# --- TUI framework -------------------------------------------------------
# `ratatui` is the widget/layout toolkit named directly in
# ARCHITECTURE.md's tech stack (List, Tabs, Paragraph, Block, etc.). Not
# used yet in this first milestone — the RSS fetcher stands alone — but
# declared now so the dependency set matches the architecture doc, and the
# `ui/` module below is scaffolded as a placeholder for it.
ratatui = "0.30.2"

# --- HTTP client -----------------------------------------------------
# `reqwest` performs the actual network requests fetchers make (RSS feeds,
# and later Reddit's/HN's JSON APIs). It's built on `tokio` (below) and is
# async by default, which is why fetching a feed involves `.await`.
#
# reqwest's rustls backend always links `rustls-platform-verifier`, which
# asks the *OS* for its trusted root certs (Keychain on macOS, Windows cert
# store, Android's system trust manager, ...). Older reqwest versions let
# you swap that out for a bundled cert list at the Cargo-feature level (a
# `rustls-tls-webpki-roots` feature); 0.13 removed that knob -- the
# platform verifier is always compiled in, and whether it's actually *used*
# at runtime is decided in code (see `fetchers::rss::HTTP_CLIENT`) by
# whether the `Client` was given its own root certs via `tls_certs_only()`.
# On Android/Termux there's no real Android app context for the platform
# verifier to hook into, so leaving that decision at its default panics at
# first use with "Expect rustls-platform-verifier to be initialized". The
# `webpki-root-certs` dependency below supplies the bundled Mozilla roots
# `HTTP_CLIENT` uses instead, so no OS trust store is ever consulted --
# same behavior on desktop and Termux.
reqwest = "0.13.4"

# --- Embedded database ----------------------------------------------
# `rusqlite` is a Rust binding to SQLite, matching ARCHITECTURE.md's
# storage layer choice: an embedded `.db` file, no separate database
# server/process to run. The "bundled" feature compiles SQLite's C source
# directly into our binary instead of requiring a system-installed SQLite
# library — this keeps the "single static binary, fast startup" property
# the architecture doc calls out as the whole reason for choosing Rust.
# The "chrono" feature teaches `rusqlite` to convert `chrono::DateTime<Utc>`
# (the type `Article::timestamp` uses, see models.rs) to and from a SQLite
# column automatically, so `storage/mod.rs` never has to hand-write that
# conversion — the same reasoning as chrono's own "serde" feature above.
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }

# --- Serialization -------------------------------------------------------
# `serde` ("SERialize/DEserialize") is the standard framework Rust code
# uses to convert between in-memory structs and external formats like JSON
# or TOML. The "derive" feature enables `#[derive(Serialize,
# Deserialize)]` — annotating a struct with that macro auto-generates the
# conversion code for it, instead of writing it by hand.
serde = { version = "1.0.229", features = ["derive"] }
# `serde_json` is the JSON backend for serde — used for talking to APIs
# that respond in JSON (Reddit, HN/Algolia).
serde_json = "1.0.151"

# --- Async runtime -------------------------------------------------------
# Rust's `async fn` / `.await` syntax describes *what* should happen
# concurrently, but the language itself ships no async executor — you pick
# one as a library. `tokio` is the de facto standard, and is what actually
# schedules and runs our async fetches (including running multiple
# fetchers concurrently, per ARCHITECTURE.md). The "full" feature enables
# its whole toolkit (multi-threaded scheduler, timers, etc.) rather than
# making us opt into pieces individually — reasonable for an application,
# more restraint is generally used in a library.
tokio = { version = "1.53.1", features = ["full"] }

# --- Running several downloads at once ------------------------------------
# `futures-util` provides `Stream` helpers on top of async code. `fetch_all`
# uses one of them, `buffered(n)`, to download up to `n` feeds at the same time
# while still handing the results back in the original order. It was already
# compiled into the build (reqwest depends on it); this makes it a direct
# dependency. `default-features = false` plus `alloc` keeps it to just what
# `buffered` needs.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }

# --- Config file format -----------------------------------------------
# `toml` reads/writes `sources.toml` and `theme.toml`. Note:
# ARCHITECTURE.md specifically calls for `toml_edit` (not plain `toml`)
# for the *writing* side of the in-app "add a source" flow, because
# `toml_edit` preserves existing formatting/comments on write instead of
# rewriting the whole file from scratch. Plain `toml` is kept here for the
# simpler *read* paths (e.g. loading `theme.toml` at startup).
toml = "1.1.4"

# `toml_edit` is `toml`'s lower-level sibling: instead of round-tripping
# through a `serde` struct (which only knows the *fields* it was told
# about, and would silently drop every comment/blank line in the file on
# write), it parses into a mutable "document" that remembers the file's
# exact formatting and lets us surgically append one new `[[source]]`
# block. That's what the in-app "add a source" flow
# (`fetchers::config::add_source`, wired up from `ui`'s `a` keybind) needs
# -- a user's hand-written comments in `sources.toml` (see the topic
# groupings left in the real config file) must survive tuxwire writing to
# it. Only the "parse" and "display" features are enabled (the defaults
# minus "serde"/"debug"/"unbounded") -- this project only ever reads and
# writes plain TOML text, never converts a document to/from a serde type
# via this crate (plain `toml`, above, already covers that), so there's no
# reason to pull in the rest.
toml_edit = "0.25.13"

# --- Bundled TLS root certificates --------------------------------------
# Full Mozilla root CA certificates in plain X.509 DER form, used by
# `fetchers::rss::HTTP_CLIENT` to build a `reqwest::Client` that trusts a
# baked-in cert list instead of asking the OS for one (see the comment on
# `reqwest` above for why). The similarly-named `webpki-roots` crate is
# *not* a substitute here: it stores certs pre-trimmed to just the fields
# `rustls`/`webpki` need internally, not full DER, so it can't be fed to
# `reqwest::Certificate::from_der`.
webpki-root-certs = "1.0.9"
